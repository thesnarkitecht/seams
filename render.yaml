# One-click deploy: https://render.com/deploy?repo=<your repo URL>
# Render gives you HTTPS (needed for cameras/mics) and keeps the database on a persistent disk.
services:
  - type: web
    name: seams
    runtime: docker
    plan: starter # persistent disks need a paid plan
    healthCheckPath: /
    disk:
      name: seams-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY # optional: built-in Claude agents
        sync: false
      - key: SEAMS_OPEN_SIGNUP
        value: "true"
      - key: SEAMS_ICE_SERVERS # optional: add a TURN server for strict corporate networks
        sync: false
